[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jared-ring-tracker"
version = "1.1.0"
description = "Monitor Jared.com ring prices and alert on drops, increases, and all-time record lows via Discord."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "JayCaseyAnalyst" }]
keywords = ["scraper", "pricing", "discord", "tracker", "browser-automation"]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
jared-tracker = "ring_tracker:cli"

[tool.setuptools]
py-modules = ["ring_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E9", "B"]